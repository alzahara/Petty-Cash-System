{% extends 'claims/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Submit Petty Cash Claim</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Claim Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Eg: Client Lunch" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="Meals">Meals</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Office Expense">Office Expense</option>
                            <option value="Stationery">Stationery</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount in USD ($)</label>
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description / Reason</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Write reason for expense..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Receipt</label>
                        <input type="file" name="receipt" class="form-control" accept="image/*" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'employee_dashboard' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Submit Claim</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
